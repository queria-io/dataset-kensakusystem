name: "kensakusystem"
version: "1.0.0"

profile: "kensakusystem"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  kensakusystem:
    +database: kensakusystem
    +materialized: table
    # raw は取得したまま、stg は ID の付与と重複の除外。どちらも mart の SQL に展開し、テーブルは作らない
    minutes:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
